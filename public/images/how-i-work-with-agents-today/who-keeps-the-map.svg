<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
  <title id="t">Who keeps the map</title>
  <desc id="d">Before, with one session per task, you sit in the middle of five sessions and track which one is doing what. Now, with one agent per project, you talk to one agent, and it tracks a subagent, a Linux box and cloud containers.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1400" height="760" fill="#fcf0dc"/>

  <text x="80" y="88" class="sans" font-size="38" font-weight="600" fill="#1c1612">Who keeps the map</text>
  <text x="80" y="130" class="sans" font-size="24" fill="#4a4038">The same work, tracked in a different place</text>

  <rect x="60" y="165" width="625" height="540" rx="18" fill="#fff8ec" stroke="#e3d1bb" stroke-width="2"/>
  <rect x="715" y="165" width="625" height="540" rx="18" fill="#fff8ec" stroke="#e3d1bb" stroke-width="2"/>

  <text x="92" y="215" class="sans" font-size="28" font-weight="600" fill="#b8432a">Before: one session per task</text>
  <text x="747" y="215" class="sans" font-size="28" font-weight="600" fill="#4a6508">Now: one agent per project</text>

  <!-- before: lines -->
  <g stroke="#b8432a" stroke-width="3" fill="none">
    <line x1="372" y1="440" x2="372" y2="290"/>
    <line x1="372" y1="440" x2="170" y2="365"/>
    <line x1="372" y1="440" x2="574" y2="365"/>
    <line x1="372" y1="440" x2="190" y2="570"/>
    <line x1="372" y1="440" x2="554" y2="570"/>
  </g>
  <!-- before: sessions -->
  <g fill="#fbe2d6" stroke="#b8432a" stroke-width="2.5">
    <rect x="297" y="240" width="150" height="58" rx="10"/>
    <rect x="90" y="335" width="150" height="58" rx="10"/>
    <rect x="504" y="335" width="150" height="58" rx="10"/>
    <rect x="115" y="540" width="150" height="58" rx="10"/>
    <rect x="479" y="540" width="150" height="58" rx="10"/>
  </g>
  <g class="sans" font-size="23" fill="#1c1612" text-anchor="middle">
    <text x="372" y="277">session</text>
    <text x="165" y="372">session</text>
    <text x="579" y="372">session</text>
    <text x="190" y="577">session</text>
    <text x="554" y="577">session</text>
  </g>
  <circle cx="372" cy="440" r="56" fill="#1c1612"/>
  <text x="372" y="450" class="sans" font-size="28" font-weight="600" fill="#fcf0dc" text-anchor="middle">You</text>
  <text x="372" y="668" class="sans" font-size="27" fill="#1c1612" text-anchor="middle">You track what each one is doing</text>

  <!-- now: lines -->
  <line x1="880" y1="440" x2="965" y2="440" stroke="#4a6508" stroke-width="6"/>
  <g stroke="#4a6508" stroke-width="3" fill="none">
    <line x1="1105" y1="440" x2="1165" y2="310"/>
    <line x1="1105" y1="440" x2="1165" y2="440"/>
    <line x1="1105" y1="440" x2="1165" y2="570"/>
  </g>
  <circle cx="825" cy="440" r="56" fill="#1c1612"/>
  <text x="825" y="450" class="sans" font-size="28" font-weight="600" fill="#fcf0dc" text-anchor="middle">You</text>
  <rect x="965" y="395" width="140" height="90" rx="12" fill="#4a6508"/>
  <text x="1035" y="450" class="sans" font-size="30" font-weight="600" fill="#fcf0dc" text-anchor="middle">Agent</text>
  <g fill="#e9eed2" stroke="#4a6508" stroke-width="2.5">
    <rect x="1165" y="281" width="155" height="58" rx="10"/>
    <rect x="1165" y="411" width="155" height="58" rx="10"/>
    <rect x="1165" y="541" width="155" height="58" rx="10"/>
  </g>
  <g class="sans" font-size="23" fill="#1c1612" text-anchor="middle">
    <text x="1242" y="318">Subagent</text>
    <text x="1242" y="448">Linux box</text>
    <text x="1242" y="578">Containers</text>
  </g>
  <text x="1027" y="668" class="sans" font-size="27" fill="#1c1612" text-anchor="middle">The agent tracks it, you ask one place</text>
</svg>
