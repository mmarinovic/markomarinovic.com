<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
  <title id="t">approvePayment() as a state chart</title>
  <desc id="d">A made-up payment lifecycle. A payment waits for approval, is approved, sent and settled. It can be rejected while waiting, or fail when sent. The planned change adds a dashed state for payments above £10,000 that wait for a second approver, and asks who approves a scheduled payment there.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a6508"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#fcf0dc"/>

  <text x="80" y="88" class="sans" font-size="38" font-weight="600" fill="#1c1612">The change, drawn on what exists today</text>
  <text x="80" y="130" class="sans" font-size="24" fill="#4a4038">Made-up example. Solid is the code now. Dashed is the change.</text>

  <!-- today's transitions -->
  <g stroke="#4a6508" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="330" y1="425" x2="438" y2="425"/>
    <line x1="660" y1="425" x2="768" y2="425"/>
    <line x1="990" y1="425" x2="1098" y2="425"/>
    <line x1="220" y1="470" x2="220" y2="578"/>
    <line x1="880" y1="470" x2="880" y2="578"/>
  </g>
  <line x1="68" y1="425" x2="110" y2="425" stroke="#4a6508" stroke-width="4"/>
  <circle cx="68" cy="425" r="14" fill="#4a6508"/>

  <!-- the change's transitions -->
  <g stroke="#4a6508" stroke-width="4" fill="none" stroke-dasharray="11 9" marker-end="url(#a)">
    <line x1="220" y1="380" x2="275" y2="268"/>
    <line x1="495" y1="268" x2="550" y2="378"/>
  </g>

  <!-- today's states -->
  <g fill="#fff8ec" stroke="#cbb9a3" stroke-width="3">
    <rect x="110" y="380" width="220" height="90" rx="14"/>
    <rect x="440" y="380" width="220" height="90" rx="14"/>
    <rect x="770" y="380" width="220" height="90" rx="14"/>
    <rect x="1100" y="380" width="220" height="90" rx="14"/>
    <rect x="110" y="580" width="220" height="90" rx="14"/>
    <rect x="770" y="580" width="220" height="90" rx="14"/>
  </g>
  <g class="sans" font-size="28" font-weight="600" fill="#1c1612" text-anchor="middle">
    <text x="220" y="435">Waiting</text>
    <text x="550" y="435">Approved</text>
    <text x="880" y="435">Sent</text>
    <text x="1210" y="435">Settled</text>
    <text x="220" y="635">Rejected</text>
    <text x="880" y="635">Failed</text>
  </g>

  <!-- the new state -->
  <rect x="275" y="178" width="220" height="90" rx="14" fill="#e9eed2" stroke="#4a6508" stroke-width="3" stroke-dasharray="11 9"/>
  <text x="385" y="216" class="sans" font-size="26" font-weight="600" fill="#1c1612" text-anchor="middle">Waiting for</text>
  <text x="385" y="250" class="sans" font-size="26" font-weight="600" fill="#1c1612" text-anchor="middle">2nd approver</text>

  <!-- labels -->
  <g class="mono" font-size="22" fill="#4a4038">
    <text x="228" y="310" text-anchor="end">above £10,000</text>
    <text x="540" y="318">approve</text>
    <text x="385" y="404" text-anchor="middle">approve</text>
    <text x="715" y="404" text-anchor="middle">send</text>
    <text x="1044" y="404" text-anchor="middle">webhook</text>
    <text x="234" y="532">reject</text>
    <text x="894" y="532">provider error</text>
  </g>

  <!-- the question -->
  <line x1="495" y1="223" x2="650" y2="223" stroke="#685c52" stroke-width="3" stroke-dasharray="4 8"/>
  <text x="664" y="212" class="sans" font-size="30" font-weight="600" fill="#1c1612">The scheduled job approves with no person.</text>
  <text x="664" y="252" class="sans" font-size="30" fill="#4a4038">Who approves its payments here?</text>
</svg>
