<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
  <title id="t">Two kinds of knowledge go stale at different speeds</title>
  <desc id="d">A sketch of how far you can trust what you remember, over time since you last read the code. Architecture knowledge declines slowly over six months. Local detail drops most of the way within a few weeks.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="1400" height="760" fill="#fcf0dc"/>

  <text x="80" y="92" class="sans" font-size="34" font-weight="600" fill="#1c1612">Two kinds of knowledge, two speeds of decay</text>
  <text x="80" y="134" class="sans" font-size="22" fill="#4a4038">How far you can trust what you remember about the code, by time since you last read it</text>

  <!-- axes -->
  <g stroke="#cbb9a3" stroke-width="2">
    <line x1="160" y1="200" x2="160" y2="620"/>
    <line x1="160" y1="620" x2="1320" y2="620"/>
  </g>
  <!-- gridlines -->
  <g stroke="#e3d1bb" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="160" y1="410" x2="1320" y2="410"/>
    <line x1="160" y1="230" x2="1320" y2="230"/>
  </g>
  <g class="mono" font-size="17" fill="#685c52" text-anchor="end">
    <text x="146" y="236">high</text>
    <text x="146" y="416">half</text>
    <text x="146" y="626">none</text>
  </g>
  <g class="mono" font-size="17" fill="#685c52" text-anchor="middle">
    <text x="160" y="656">today</text>
    <text x="353" y="656">1 week</text>
    <text x="547" y="656">1 month</text>
    <text x="933" y="656">3 months</text>
    <text x="1320" y="656">6 months</text>
  </g>
  <g stroke="#cbb9a3" stroke-width="2">
    <line x1="353" y1="620" x2="353" y2="630"/>
    <line x1="547" y1="620" x2="547" y2="630"/>
    <line x1="933" y1="620" x2="933" y2="630"/>
    <line x1="1320" y1="620" x2="1320" y2="630"/>
  </g>

  <!-- architecture: slow decline -->
  <path d="M160 232 C 500 240, 900 270, 1320 318" fill="none" stroke="#456308" stroke-width="6" stroke-linecap="round"/>
  <!-- local detail: fast decline -->
  <path d="M160 232 C 250 250, 300 430, 420 520 S 800 598, 1320 606" fill="none" stroke="#b54324" stroke-width="6" stroke-linecap="round"/>

  <!-- labels -->
  <text x="1310" y="358" class="sans" font-size="23" font-weight="600" fill="#456308" text-anchor="end">Broad awareness</text>
  <text x="1310" y="386" class="sans" font-size="18" fill="#4a4038" text-anchor="end">where the services live, who owns auth</text>

  <text x="560" y="468" class="sans" font-size="23" font-weight="600" fill="#b54324">Current local detail</text>
  <text x="560" y="496" class="sans" font-size="18" fill="#4a4038">what this function returns on empty input, who calls it</text>

  <!-- footer -->
  <text x="80" y="712" class="sans" font-size="18" fill="#685c52">A sketch, not a measurement. Keep the first kind. Rebuild the second from the code before each change.</text>
</svg>
