<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
  <title id="t">How a story gets written</title>
  <desc id="d">The parent's wishes go to a first agent that proposes five starting points. Code picks one at random. A second agent writes four drafts in parallel. Code throws out drafts that won't print well. A judge agent ranks the rest, and the best one is printed exactly as written.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#685c52"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#fcf0dc"/>

  <text x="80" y="88" class="sans" font-size="38" font-weight="600" fill="#1c1612">How a story gets written</text>
  <text x="80" y="130" class="sans" font-size="24" fill="#4a4038">Three agents, and code where code is better than a model</text>

  <!-- legend -->
  <rect x="925" y="66" width="26" height="26" rx="6" fill="#4a6508"/>
  <text x="961" y="87" class="sans" font-size="22" fill="#4a4038">agent</text>
  <rect x="1060" y="66" width="26" height="26" rx="6" fill="#fff8ec" stroke="#b8432a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="1096" y="87" class="sans" font-size="22" fill="#4a4038">plain code</text>

  <!-- 1 wishes -->
  <rect x="60" y="300" width="180" height="200" rx="16" fill="#fff8ec" stroke="#cbb9a3" stroke-width="3"/>
  <text x="150" y="370" class="sans" font-size="27" font-weight="600" fill="#1c1612" text-anchor="middle">Parent's</text>
  <text x="150" y="404" class="sans" font-size="27" font-weight="600" fill="#1c1612" text-anchor="middle">wishes</text>
  <text x="150" y="448" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">age, hero, cast,</text>
  <text x="150" y="474" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">what it's about</text>

  <!-- 2 five starting points -->
  <rect x="280" y="250" width="190" height="300" rx="16" fill="#4a6508"/>
  <text x="375" y="292" class="sans" font-size="23" font-weight="600" fill="#fcf0dc" text-anchor="middle">Agent 1</text>
  <g fill="#e9eed2">
    <rect x="305" y="312" width="140" height="34" rx="7"/>
    <rect x="305" y="354" width="140" height="34" rx="7"/>
    <rect x="305" y="396" width="140" height="34" rx="7" fill="#fcf0dc" stroke="#e3b341" stroke-width="4"/>
    <rect x="305" y="438" width="140" height="34" rx="7"/>
    <rect x="305" y="480" width="140" height="34" rx="7"/>
  </g>
  <g class="mono" font-size="19" fill="#1c1612" text-anchor="middle">
    <text x="375" y="336">start 1</text><text x="375" y="378">start 2</text><text x="375" y="420" font-weight="700">start 3</text><text x="375" y="462">start 4</text><text x="375" y="504">start 5</text>
  </g>
  <text x="375" y="585" class="sans" font-size="21" fill="#4a4038" text-anchor="middle">five starting points</text>

  <!-- 3 random pick -->
  <rect x="510" y="330" width="150" height="140" rx="16" fill="#fff8ec" stroke="#b8432a" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="560" y="352" width="50" height="50" rx="9" fill="#fcf0dc" stroke="#1c1612" stroke-width="3"/>
  <g fill="#1c1612"><circle cx="573" cy="365" r="4.5"/><circle cx="585" cy="377" r="4.5"/><circle cx="597" cy="389" r="4.5"/></g>
  <text x="585" y="432" class="sans" font-size="22" font-weight="600" fill="#1c1612" text-anchor="middle">pick one</text>
  <text x="585" y="456" class="sans" font-size="22" font-weight="600" fill="#1c1612" text-anchor="middle">at random</text>
  <text x="585" y="510" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">a model would</text>
  <text x="585" y="536" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">pick the safest</text>

  <!-- 4 four drafts -->
  <rect x="700" y="250" width="190" height="300" rx="16" fill="#4a6508"/>
  <text x="795" y="292" class="sans" font-size="23" font-weight="600" fill="#fcf0dc" text-anchor="middle">Agent 2</text>
  <g fill="#e9eed2">
    <rect x="725" y="315" width="140" height="44" rx="7"/>
    <rect x="725" y="369" width="140" height="44" rx="7"/>
    <rect x="725" y="423" width="140" height="44" rx="7"/>
    <rect x="725" y="477" width="140" height="44" rx="7"/>
  </g>
  <g class="mono" font-size="19" fill="#1c1612" text-anchor="middle">
    <text x="795" y="344">draft A</text><text x="795" y="398">draft B</text><text x="795" y="452">draft C</text><text x="795" y="506">draft D</text>
  </g>
  <text x="795" y="585" class="sans" font-size="21" fill="#4a4038" text-anchor="middle">four drafts in parallel</text>

  <!-- 5 code filter -->
  <rect x="930" y="330" width="150" height="140" rx="16" fill="#fff8ec" stroke="#b8432a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1005" y="385" class="sans" font-size="22" font-weight="600" fill="#1c1612" text-anchor="middle">drop what</text>
  <text x="1005" y="411" class="sans" font-size="22" font-weight="600" fill="#1c1612" text-anchor="middle">won't print</text>
  <text x="1005" y="447" class="mono" font-size="17" fill="#b8432a" text-anchor="middle">long title ✗</text>
  <text x="1005" y="510" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">then shuffle,</text>
  <text x="1005" y="536" class="sans" font-size="20" fill="#4a4038" text-anchor="middle">so order is no hint</text>

  <!-- 6 judge -->
  <rect x="1120" y="250" width="220" height="300" rx="16" fill="#4a6508"/>
  <text x="1230" y="292" class="sans" font-size="23" font-weight="600" fill="#fcf0dc" text-anchor="middle">Agent 3, the judge</text>
  <g class="sans" font-size="20" fill="#fcf0dc">
    <text x="1146" y="336">ranks against:</text>
    <text x="1146" y="368">· the parent's brief</text>
    <text x="1146" y="396">· the child's age</text>
    <text x="1146" y="424">· story craft</text>
    <text x="1146" y="452">· safety rules</text>
  </g>
  <rect x="1146" y="474" width="168" height="50" rx="9" fill="#fcf0dc" stroke="#e3b341" stroke-width="4"/>
  <text x="1230" y="507" class="sans" font-size="22" font-weight="600" fill="#1c1612" text-anchor="middle">winner, printed</text>
  <text x="1230" y="585" class="sans" font-size="21" fill="#4a4038" text-anchor="middle">exactly as written</text>

  <!-- arrows -->
  <g stroke="#685c52" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="242" y1="400" x2="274" y2="400"/>
    <line x1="472" y1="400" x2="504" y2="400"/>
    <line x1="662" y1="400" x2="694" y2="400"/>
    <line x1="892" y1="400" x2="924" y2="400"/>
    <line x1="1082" y1="400" x2="1114" y2="400"/>
  </g>

  <text x="80" y="680" class="sans" font-size="23" fill="#4a4038">One prompt, one story gives you the model's most predictable idea, every time.</text>
</svg>
